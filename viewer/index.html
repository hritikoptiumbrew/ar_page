<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8" />
  <title>Dynamic AR Model Viewer</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    :root {
      --primary: #FF6B35;
      --primary-glow: rgba(255, 107, 53, 0.4);
      --accent: #E87A5D;
      --bg-dark: #050505;
      --text-main: #FFFFFF;
      --border: rgba(255, 255, 255, 0.1);
    }

    body {
      margin: 0;
      background: linear-gradient(125deg, #050505, #111111, #080808);
      background-size: 300% 300%;
      animation: subtleDrift 20s ease infinite;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
      color: var(--text-main);
    }

    @keyframes subtleDrift {
      0% {
        background-position: 0% 50%
      }

      50% {
        background-position: 100% 50%
      }

      100% {
        background-position: 0% 50%
      }
    }

    .header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: white;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .brand-logo {
      font-size: 20px;
      font-weight: 800;
      color: white;
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .brand-logo span {
      color: var(--primary);
    }

    #viewer-box {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }

    #ar-button-container {
      position: fixed;
      bottom: 50px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      z-index: 100;
    }

    #ar-button {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      color: white;
      border: none;
      padding: 20px 48px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 10px 30px rgba(255, 107, 53, 0.4);
      display: flex;
      align-items: center;
      gap: 15px;
      transition: all 0.3s ease;
    }

    #ar-button:hover {
      transform: scale(1.05) translateY(-2px);
      box-shadow: 0 15px 40px rgba(255, 107, 53, 0.5);
    }

    #warning-banner {
      position: fixed;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 68, 68, 0.1);
      color: #ff4444;
      text-align: center;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      z-index: 1000;
      display: none;
      border: 1px solid rgba(255, 68, 68, 0.2);
      backdrop-filter: blur(10px);
      max-width: 90%;
    }
  </style>
</head>

<body>

  <header class="header">
    <a href="javascript:history.back()" class="back-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </a>
    <a href="/" class="brand-logo">Menu<span>XR</span></a>
    <div style="width: 45px;"></div>
  </header>

  <div id="warning-banner"></div>

  <div id="viewer-box">
    <model-viewer id="viewer" ar ar-modes="webxr scene-viewer quick-look" camera-controls shadow-intensity="1"
      exposure="1.2">
    </model-viewer>
  </div>

  <div id="ar-button-container">
    <button id="ar-button" onclick="document.querySelector('#viewer').activateAR()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12V7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v5"></path>
        <path d="M19 19v-4a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v4"></path>
      </svg>
      View on your table
    </button>
  </div>

  <script>
    // Function to get URL parameter by name
    function getUrlParameter(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }

    // Function to validate the model URL
    function validateModelUrl(url) {
      // Check if the URL has a valid 3D model extension
      const validExtensions = ['.glb', '.gltf', '.usdz', '.fbx', '.obj'];
      const lowerUrl = url.toLowerCase();
      return validExtensions.some(ext => lowerUrl.includes(ext));
    }

    // Function to generate file paths from model name
    function generateModelPaths(modelName) {
      // If modelName includes a file extension, treat it as a path/URL
      if (modelName && modelName.includes('.')) {
        return { src: modelName, iosSrc: modelName };
      }

      // Otherwise, treat as model name and generate relative paths in the project
      return {
        src: `/models/${modelName}.glb`,
        iosSrc: `/models/${modelName}.usdz`
      };
    }

    // Get the model name from the 'model' parameter
    const modelName = getUrlParameter('model');
    const iosModelName = getUrlParameter('ios-model'); // Allow override via ios-model param

    // Validate and set the model source
    if (modelName) {
      const viewer = document.querySelector("#viewer");

      // Generate paths for the model
      const modelPaths = generateModelPaths(modelName);
      viewer.setAttribute('src', modelPaths.src);

      // Function to check if a file exists
      async function checkFileExists(url) {
        try {
          const response = await fetch(url, { method: 'HEAD' });
          return response.ok;
        } catch (e) {
          return false;
        }
      }

      // Perform validation checks
      async function validateFiles() {
        const warningBanner = document.getElementById('warning-banner');
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

        const glbExists = await checkFileExists(modelPaths.src);

        // Determine USDZ path to check
        let usdzPath = modelPaths.iosSrc;
        if (iosModelName) {
          usdzPath = iosModelName.includes('.') ? iosModelName : `/models/${iosModelName}.usdz`;
        }
        const usdzExists = await checkFileExists(usdzPath);

        if (!glbExists) {
          warningBanner.textContent = `Warning: Main model file (.glb) not found at ${modelPaths.src}`;
          warningBanner.style.background = "#ff4444";
          warningBanner.style.color = "white";
          warningBanner.style.display = 'block';
        } else if (isIOS && !usdzExists) {
          warningBanner.textContent = `Missing AR file (.usdz) for iOS. AR will not work on this device.`;
          warningBanner.style.display = 'block';
        } else if (!usdzExists) {
          console.warn(`Note: .usdz file not found at ${usdzPath}. AR will not work on iOS devices.`);
        }
      }

      validateFiles();

      // Set iOS source - if specific iOS model is provided, validate and use it
      if (iosModelName) {
        // If the iosModelName has an extension, treat as full path/URL
        if (iosModelName.includes('.')) {
          if (validateModelUrl(iosModelName)) {
            viewer.setAttribute('ios-src', iosModelName);
          } else {
            console.warn('Invalid iOS model provided, using default iOS model as fallback');
            viewer.setAttribute('ios-src', modelPaths.iosSrc);
          }
        } else {
          // If iosModelName doesn't have an extension, generate path with .usdz extension
          viewer.setAttribute('ios-src', `/models/${iosModelName}.usdz`);
        }
      } else {
        // Use generated iOS model path
        viewer.setAttribute('ios-src', modelPaths.iosSrc);
      }
    } else {
      // Show error for missing model parameter
      const errorMessage = document.getElementById('error-message');
      errorMessage.textContent = 'No model provided. Please add ?model=MODEL_NAME (e.g., chickBurger for chickBurger.glb) to the URL.';
      errorMessage.style.display = 'block';
    }

    // AR button functionality
    const btn = document.querySelector("#ar-button");
    if (btn) {
      btn.addEventListener("click", () => {
        const viewer = document.querySelector("#viewer");
        if (viewer && viewer.canActivateAR) {
          viewer.activateAR();
        } else if (viewer) {
          viewer.dispatchEvent(new CustomEvent('ar-trigger'));
        }
      });
    }

    // When AR closes → show button again automatically
    const viewer = document.querySelector("#viewer");
    if (viewer) {
      viewer.addEventListener('ar-status', (event) => {
        const btn = document.querySelector("#ar-button");
        if (btn && event.detail.status === 'not-presenting') {
          btn.style.display = "flex";
        }
      });
    }
  </script>

</body>

</html>
